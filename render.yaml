# Render Blueprint: one web service that runs the API and serves the website.
# Deploy: https://render.com/deploy?repo=https://github.com/dher405/Personal/tree/slotwise
services:
  - type: web
    name: slotwise
    runtime: node
    # A paid instance type: free instances can't have a disk and can't reach email (SMTP) ports.
    plan: starter
    branch: slotwise
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript/Vite and type packages needed to build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/slotwise.db
      # Test deployment: sample business, test-mode payments, simulated texts.
      # Remove before taking real customers.
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      # You'll be asked for these when you create the Blueprint.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Optional: fill in later under the service's Environment tab.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: APPLE_SERVICES_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    # Everything (bookings, every business's settings and keys, platform settings) is in one SQLite
    # file. It lives on this disk so it survives restarts and deploys; the rest of the server's disk is wiped.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
